<!doctype html><title>fault page</title>
<p id=zl>fault</p>
<script>
window.__zl_fault = null;
const r = String(Math.random()).slice(2, 10);
const post = fetch("http://127.0.0.1:7103/commit?r=" + r, { method: "POST", body: "payload-zl-64" })
  .then((r2) => ({ kind: "post", r, ok: r2.ok, status: r2.status }), (e) => ({ kind: "post", r, err: String(e) }));
const get = fetch("http://127.0.0.1:7103/commit?r=" + r, { method: "GET" })
  .then((r2) => ({ kind: "get", r, ok: r2.ok, status: r2.status }), (e) => ({ kind: "get", r, err: String(e) }));
const control = fetch("http://127.0.0.1:7103/ok?r=" + r, { method: "POST", body: "c" })
  .then((r2) => ({ kind: "control", r, ok: r2.ok, status: r2.status }), (e) => ({ kind: "control", r, err: String(e) }));
const posth = fetch("http://127.0.0.1:7103/drop-headers?r=" + r, { method: "POST", body: "payload-zl-h" })
  .then((r2) => ({ kind: "posth", r, ok: r2.ok, status: r2.status }), (e) => ({ kind: "posth", r, err: String(e) }));
const postc = fetch("http://127.0.0.1:7104/commit?r=" + r, { method: "POST", body: "payload-zl-c" })
  .then((r2) => ({ kind: "postc", r, ok: r2.ok, status: r2.status }), (e) => ({ kind: "postc", r, err: String(e) }));
Promise.allSettled([post, get, control, posth, postc]).then((v) => {
  window.__zl_fault = v.map((x) => x.status === "fulfilled" ? x.value : String(x.reason));
});
</script>
