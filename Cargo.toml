[workspace]
resolver = "2"
members = ["crates/adblock", "crates/config", "crates/cookies", "crates/cookies-wasm", "crates/csp", "crates/seam-wasm", "crates/rewriter", "crates/wisp-wasm", "crates/zeolite-server", "crates/wisp-core", "crates/wisp-extensions"]

[workspace.package]
version = "3.4.2"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
wisp-core = { path = "crates/wisp-core" }
wisp-extensions = { path = "crates/wisp-extensions" }
zeolite-csp = { path = "crates/csp" }
zeolite-config = { path = "crates/config" }
wasm-bindgen = "0.2"
bytes = "1"
thiserror = "2"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
pbkdf2 = "0.12"
subtle = "2"

[profile.release]
opt-level = "z"
lto = true
