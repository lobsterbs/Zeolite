name: libcurljs-fork-build

# One-shot CI builder for the vendored libcurl.js streaming-upload fork
# (#556). The sprite egress cannot reach storage.googleapis.com, so the
# emsdk toolchain and the wasm build run here instead. The built bundle
# is committed back to this branch under vendor/libcurljs/dist/.
on:
  push:
    branches:
      - libcurljs-fork
    paths:
      - "vendor/libcurljs/**"
      - ".github/workflows/libcurljs-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: libcurljs-fork
      # apt emscripten, matching upstream ading2210/libcurl.js CI
      # (build.yaml): emsdk latest (7.0.0) removed the allocate and
      # ALLOC_NORMAL runtime methods the 0.7.5 build exports.
      - name: Install emscripten
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake emscripten autoconf automake libtool pkg-config wget xxd
      - name: Build dependencies and libcurl.js (release + single file)
        run: |
          cd vendor/libcurljs/client
          # push_files-created blobs are mode 100644; restore the exec bit the
          # vendored scripts need (all_deps.sh execs tools/*.sh, build.sh re-execs itself)
          chmod +x build.sh tools/*.sh
          bash tools/all_deps.sh
          ./build.sh all
          ls -la out/
      - name: Verify the streaming-upload seam exports survive
        run: |
          cd vendor/libcurljs/client/out
          for fn in _http_get_info _http_set_options _http_set_cookie_jar _http_set_upload_stream _http_pause; do
            grep -q "$fn" libcurl_full.mjs || { echo "::error::MISSING export $fn"; exit 1; }
          done
          echo "seam exports verified"
          wc -c libcurl_full.mjs libcurl.mjs libcurl.wasm
      - name: Commit the built bundle to the fork branch
        run: |
          git config user.name "zeolite-ci"
          git config user.email "ci@zeolite.invalid"
          mkdir -p vendor/libcurljs/dist
          cp vendor/libcurljs/client/out/libcurl_full.mjs vendor/libcurljs/dist/
          cp vendor/libcurljs/client/out/libcurl.mjs vendor/libcurljs/dist/
          cp vendor/libcurljs/client/out/libcurl.wasm vendor/libcurljs/dist/
          git add vendor/libcurljs/dist
          git commit -m "build(libcurljs): wasm build of the streaming-upload fork (#556) [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:libcurljs-fork
