name: w597 merge main
on:
  push:
    branches: [zl-ext-halfwork-closure]
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zl-ext-halfwork-closure
      - name: merge origin/main
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge origin/main; then
            echo "CLEAN MERGE"
          else
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "CONFLICTED FILES: [$conflicts]"
            for f in $conflicts; do
              case "$f" in
                app/src/control.ts|app/src/extensions/compat.ts|app/src/extensions/downloads.ts|docs/matrix.md)
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "UNEXPECTED CONFLICT: $f"
                  exit 1
                  ;;
              esac
            done
          fi
          git commit --no-edit -m "merge origin/main into zl-ext-halfwork-closure (resolutions for #597)" || echo "NOTHING TO COMMIT"
          git push origin zl-ext-halfwork-closure
