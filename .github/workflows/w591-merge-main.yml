name: w591 merge main
on:
  push:
    branches: [zl-536-nav-interception]
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zl-536-nav-interception
      - name: guarded merge of origin/main
        run: |
          git config user.name "zeolite-bot"
          git config user.email "zeolite-bot@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already an ancestor; nothing to do"
            exit 0
          fi
          if git merge origin/main -m "Merge main into zl-536-nav-interception (pre-merge resolution for #591)"; then
            git push origin HEAD:zl-536-nav-interception
            exit 0
          fi
          echo "=== conflicted files ==="
          git diff --name-only --diff-filter=U
          RESOLVED=".github/workflows/ci.yml docs/matrix.md"
          for f in $RESOLVED; do
            if git diff --name-only --diff-filter=U | grep -qx "$f"; then
              git checkout --ours -- "$f"
              git add "$f"
            fi
          done
          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            echo "=== unexpected conflicts remain ==="
            echo "$LEFT"
            git merge --abort
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:zl-536-nav-interception
