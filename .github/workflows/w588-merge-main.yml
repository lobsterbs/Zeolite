name: w588 merge main
on:
  push:
    branches: [zl-importmap-scopes-merge]
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: zl-importmap-scopes-merge
      - name: guarded merge of origin/main
        run: |
          git config user.name "zeolite-bot"
          git config user.email "zeolite-bot@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already an ancestor; nothing to do"
            exit 0
          fi
          if git merge origin/main -m "Merge main into zl-importmap-scopes-merge (pre-merge resolution for #588)"; then
            git push origin HEAD:zl-importmap-scopes-merge
            exit 0
          fi
          echo "=== conflicted files ==="
          git diff --name-only --diff-filter=U
          git merge --abort
          exit 1
