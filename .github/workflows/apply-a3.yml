name: apply-a3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-a3.yml']
permissions:
  contents: write
  workflows: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode patch
        run: echo '' | base64 -d > /tmp/a3.patch
      - name: apply patch
        run: git apply --check /tmp/a3.patch && git apply /tmp/a3.patch
      - name: commit fix
        run: |
          git config user.name "zeolite-ci"
          git config user.email "zeolite-ci@users.noreply.github.com"
          git add .github/workflows/ci.yml app/src/__tests__/bootstrap-storage.test.ts app/src/__tests__/isolation.test.ts app/src/__tests__/reemit.test.ts app/src/__tests__/relay.test.ts app/src/__tests__/vorigin.test.ts app/src/bootstrap/isolation.ts app/src/bootstrap/mint.ts app/src/bootstrap/relay.ts app/src/bootstrap/storage.ts app/src/bootstrap/vorigin.ts
          git commit -m "fix(app): bootstrap compat wave: listener objects, storage names, worker/ES semantics (#268, #269, #273, #274, #275, #284)"
          git push
      - name: remove workflow
        run: |
          git rm -q .github/workflows/apply-a3.yml
          git commit -q -m "chore: remove one-shot apply-a3 workflow"
          git push
