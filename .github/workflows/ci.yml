[{"type":"resource","resource":{"uri":"sprite://mcp-zeolite-2/file?path=.github%2Fworkflows%2Fci.yml&workingDir=%2Fhome%2Fsprite%2Fzeo613","mimeType":"text/plain","text":"name: zeolite\n\non:\n  push:\n  pull_request:\n  schedule:\n    - cron: \"23 3 * * *\"\n  workflow_dispatch:\n\n# The engine-bundle publish step pushes the dist branch with the\n# workflow token; the repo default grants it read-only.\npermissions:\n  contents: write # nightly compat suite\n\n\n\njobs:\n  rust:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n        with:\n          targets: wasm32-unknown-unknown\n      - run: cargo fmt --all --check\n      - name: clippy\n        # CARGO_TERM_COLOR=never: the error grep below must match real\n        # \"error\"/\"warning\" line starts. With color enabled every error\n        # line starts with an ANSI escape and the gate silently passes.\n        env:\n          CARGO_TERM_COLOR: never\n        run: |\n          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.out 2>&1 || true\n          tail -c 16000 clippy.out || true\n          # Cargo own \"spurious network error\" retry warnings (a crates.io\n          # flake) start with \"warning:\" and are not lints: filter them or\n          # a network retry fails a clean run (run 38074371590).\n          grep -E \"^(error|warning)(\\[|:)\" clippy.out | grep -v \"spurious network error\" > clippyfail.out || true\n          head -9 clippyfail.out | while IFS= read -r l; do echo \"::error::CLIPPY $l\"; done\n          if [ -s clippyfail.out ]; then exit 1; fi\n      - name: test\n        env:\n          CARGO_TERM_COLOR: never\n        run: |\n          cargo test --workspace --locked > test.out 2>&1 || true\n          tail -c 16000 test.out || true\n          grep -m1 -B6 -A14 -E \"^error|FAILED|panicked at\" test.out > testslice.out || true\n          if [ -s testslice.out ]; then\n            D=$(head -c 900 testslice.out | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::TEST%0A$D\"\n            exit 1\n          fi\n      - run: cargo check -p zeolite-rewriter -p zeolite-wisp --target wasm32-unknown-unknown --locked\n\n  wasm:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: dtolnay/rust-toolchain@stable\n        with:\n          targets: wasm32-unknown-unknown\n      - name: Install wasm-pack (pinned prebuilt)\n        # cargo install wasm-pack 0.13.1 stopped resolving on 2026-10-16:\n        # every zip 2.x release its binary-install dep accepts was\n        # yanked from crates.io, so the install failed and the || true\n        # moved the failure into the build step. The pinned prebuilt\n        # tarball has no crates.io dependency surface at all.\n        run: |\n          curl -sSfL -o /tmp/wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz\n          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp\n          sudo mv /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack\n          wasm-pack --version\n      - name: Build rewriter wasm\n        run: |\n          if ! wasm-pack build crates/rewriter --target web --release --out-name rewriter_wasm > wasm1.out 2>&1; then\n            D=$(grep -m1 -A10 -i \"error\" wasm1.out | head -c 700 | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::REWASM%0A$D\"\n            exit 1\n          fi\n          mkdir -p app/src/rewriter_wasm\n          cp crates/rewriter/pkg/rewriter_wasm* app/src/rewriter_wasm/\n      - name: Build wisp wasm\n        run: |\n          if ! wasm-pack build crates/wisp-wasm --target web --release --out-name wisp_wasm > wasm2.out 2>&1; then\n            D=$(grep -m1 -A10 -i \"error\" wasm2.out | head -c 700 | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::WIWASM%0A$D\"\n            exit 1\n          fi\n          mkdir -p app/src/wisp_wasm\n          cp crates/wisp-wasm/pkg/wisp_wasm* app/src/wisp_wasm/\n      - name: Build seam wasm\n        run: |\n          if ! wasm-pack build crates/seam-wasm --target web --release --out-name seam_wasm > wasm3.out 2>&1; then\n            D=$(grep -m1 -A10 -i \"error\" wasm3.out | head -c 700 | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::SEWASM%0A$D\"\n            exit 1\n          fi\n          mkdir -p app/src/seam_wasm\n          cp crates/seam-wasm/pkg/seam_wasm* app/src/seam_wasm/\n      - name: Build adblock wasm\n        run: |\n          if ! wasm-pack build crates/adblock --target web --release --out-name adblock_wasm > wasm4.out 2>&1; then\n            D=$(grep -m1 -A10 -i \"error\" wasm4.out | head -c 700 | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::ADBFAIL%0A$D\"\n            exit 1\n          fi\n          mkdir -p app/src/adblock_wasm\n          cp crates/adblock/pkg/adblock_wasm* app/src/adblock_wasm/\n      - name: Measure wasm bundles (record; budget enforcement is the Phase 1 gate)\n        run: du -b app/src/rewriter_wasm/rewriter_wasm_bg.wasm app/src/wisp_wasm/wisp_wasm_bg.wasm app/src/seam_wasm/seam_wasm_bg.wasm app/src/adblock_wasm/adblock_wasm_bg.wasm\n      - uses: actions/upload-artifact@v4\n        with:\n          name: zeolite-wasm\n          path: app/src/\n\n  app:\n    runs-on: ubuntu-latest\n    needs: wasm\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/download-artifact@v4\n        with:\n          name: zeolite-wasm\n          path: app/src/\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      # Vendor the libcurl transport (TLS terminates client-side in\n      # libcurl.js; the SW cannot do TLS). The package is AGPL-3.0-only\n      # with a ~2.1 MB bundled dist, so it is never committed: CI pulls a\n      # pinned version and copies it into app/public/libcurl, where the\n      # committed adapter (src/libcurl-transport-vendored.ts) loads it\n      # at runtime. Deployments serving the built engine inherit AGPL\n      # obligations for that bundle and its combined work.\n      - name: Vendor libcurl transport\n        run: |\n          {\n            npm install --prefix .vendor @mercuryworkshop/libcurl-transport@2.0.6 &&\n            mkdir -p app/public/libcurl &&\n            cp -r .vendor/node_modules/@mercuryworkshop/libcurl-transport/dist/. app/public/libcurl/\n          } 2>&1 | tee vendor.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            D=$(tail -c 700 vendor.out | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::VENDOR%0A$D\"\n            exit 1\n          fi\n          ls -la app/public/libcurl\n      # Vendor the epoxy transport (selectable second engine, #64).\n      # Same never-committed rule as libcurl: the package is\n      # AGPL-3.0-only too (verified in npm metadata 2.1.20-1), so the\n      # bundle is pulled pinned at build time only. Full variant (#64 slice 3): the WebSocket\n      # bridge + gzip/brotli + HTTP/2 sit behind the package \"full\"\n      # build; minimal has fetch only, so a WS open under the epoxy\n      # engine would fail on a minimal vendor.\n      - name: Vendor epoxy transport\n        run: |\n          {\n            npm install --prefix .vendor @mercuryworkshop/epoxy-tls@2.1.20-1 &&\n            mkdir -p app/public/epoxy &&\n            cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.js app/public/epoxy/epoxy.js &&\n            cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.wasm app/public/epoxy/epoxy.wasm\n          } 2>&1 | tee epoxy.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            D=$(tail -c 700 epoxy.out | sed ':a;N;$!ba;s/\\n/%0A/g')\n            echo \"::error::EPOXY%0A$D\"\n            exit 1\n          fi\n          ls -la app/public/epoxy\n      - name: SW-scope loading lint (no dynamic import in SW-reachable code)\n        # Chromium forbids import() on ServiceWorkerGlobalScope and the\n        # failure only appears at runtime (commit 73463a4 fixed exactly\n        # this). Engine code under app/src must never call import() with\n        # a string literal. Page-context entries are exempt: import()\n        # is legal where they run. Content scripts served into pages may\n        # need an exemption later; add it here, do not weaken the gate.\n        run: |\n          cd app\n          PAT=$'import[[:space:]]*\\\\([[:space:]]*[\"\\'`]'\n          HITS=$(grep -rnE \"$PAT\" src --include='*.ts' | grep -v '__tests__' | grep -vE 'src/(main|devtools|bootstrap)\\.ts' || true)\n          if [ -n \"$HITS\" ]; then\n            echo \"$HITS\" | head -9 | while IFS= read -r l; do echo \"::error::SWIMPORT $l\"; done\n            exit 1\n          fi\n      - name: typecheck + build\n        # #617: stamp the workflow run id into the bundle so the\n        # running build is nameable (zl:ping/doctor/banner); the\n        # same id lands in the dist commit message downstream.\n        env:\n          VITE_ZEOLITE_BUILD_ID: ${{ github.run_id }}\n        run: |\n          cd app && npm install\n          npx tsc --noEmit > tsc.out 2>&1 || true\n          grep -E \"error TS\" tsc.out | head -9 | while IFS= read -r l; do echo \"::error::TSC $l\"; done\n          if grep -q \"error TS\" tsc.out; then exit 1; fi\n          npm run build\n      - name: Extension subsystem unit tests\n        # Wall-clock guard: a wedged vitest (open handles keep the\n        # process alive past the per-test timeouts) must fail the run\n        # in minutes with its last output, not hang the job for 6h.\n        run: |\n          cd app\n          rm -f vitest.out\n          code=0\n          timeout 300 npx vitest run --reporter=default > vitest.out 2>&1 || code=$?\n          if [ \"$code\" -ne 0 ]; then\n            if [ \"$code\" -eq 124 ]; then\n              echo \"::error::VITEST still running after 300s and was killed; last output below\"\n            fi\n            grep -E \"FAIL|AssertionError|Error:\" vitest.out | head -9 | while IFS= read -r l; do echo \"::error::VITEST $l\"; done\n            tail -40 vitest.out\n            exit 1\n          fi\n      - name: Verify vendored transport made it into the build\n        run: |\n          test -f app/dist/libcurl/index.mjs\n          test -f app/dist/epoxy/epoxy.js\n          test -f app/dist/epoxy/epoxy.wasm\n          test -f app/dist/seam_wasm_bg.wasm\n          test -f app/dist/adblock_wasm_bg.wasm\n      - name: Bootstrap size budget (must stay under 28 KiB minified)\n        # Raises are deliberate decisions recorded here, never quiet\n        # accommodations; CI prints the measured size. Every raise bought\n        # per-page correctness that cannot ride outside the one artifact\n        # the page loads: #28/#35 nav guard + classic-file split, #37\n        # cross-site channel isolation, #58/#59 srcdoc + setAttribute,\n        # #54 page-realm mint client + Worker hooks, #101 child-realm\n        # re-emit, #106/#108 popup guard + child isolation, #109 popup\n        # sync-open + relative nav re-emit, #121 engineUpdate reload\n        # listener, #128 legacy WebKit postMessage, #130/#132 frame\n        # identity relabel races, #236 virtual location, #248 the\n        # route-shaped vloc decode (prel-of-prel stack prevention).\n        # Raised 28672 -> 29696 for the #268/#269/#273/#274/#275/#284\n        # bootstrap compat wave (listener-object relabel + tap\n        # filter, BroadcastChannel subclass, Storage named-property\n        # Proxy, EventSource listener registry, Worker subclasses);\n        # measured 29383.\n        # Raised 29696 -> 30400 for the #364/#371/#372/#373/#374/#375\n        # bootstrap wave (srcdoc script-body split, noopener popup\n        # route, postMessage options form, ws scheme SyntaxError,\n        # backslash-origin vloc); measured 30349, baseline 29649.\n        # Raised 30400 -> 31744 for the #107 phase 2 embedder URL/title\n        # sync module; measured 31406, baseline 30381.\n        # Raised 31744 -> 33792 for the #180 anchor read\n        # virtualization (Injector phase 1: bootstrap anchorshim +\n        # the zl:decodeRoutes oracle); measured 33782, baseline 31406.\n        # Raised 33792 -> 34304 for the #387/#388 follow-up (scan\n        # window skip-memoized paging + the SVG animated-href read\n        # seam); measured 34294, baseline 33782.\n        # Raised 34304 -> 34816 for the #182 location member-write\n        # view setters (hash/search/pathname); measured 34628,\n        # baseline 34294.\n        # Raised 34816 -> 35328 for the Injector phase 2 query-shape\n        # vloc re-anchors (native-path commits keep the zlNavh\n        # token); measured 35113, baseline 34628.\n        # Raised 35328 -> 36352 for the wave-56 bootstrap rides: the\n        # ws subprotocol allow-list call repair (#419, the blooket\n        # Colyseus class) and the anchor read scan order fix (#418,\n        # attribute before absolute); measured 35662, baseline 35113.\n        # Raised 36352 -> 37888 for registered-embedder popup routing\n        # and client/icon metadata (#416/#428). The strict byte gate\n        # remains; measure the complete bundle after each change.\n        # #497 retains the 39424 gate after reconciling main's anchor\n        # and embedder recovery fixes. Share control-query cleanup rather\n        # than accepting the integration's transient 41566-byte bundle.\n        # Raised 37888 -> 39424 for the scout-wave listener\n        # registries: capture-aware wrapper identity (#472 in\n        # vorigin/relay) and storage once/signal/capture parity\n        # (#475); measured 38471, baseline 37311.\n        # Raised 39424 -> 39680 for #477 wave 3: the swshim\n        # register/unregister forward to the engine controller\n        # (guest spawn/unspawn); measured 39501.\n        # Raised 39680 -> 40704 for #510: the URL parse seam -\n        # inline-script route harvest + the wrapped URL constructor\n        # serving decoded data-island destinations; measured 40570,\n        # baseline 39501.\n        # Raised 40704 -> 41216 for the storage + navigation\n        # wave: the site-scoped indexedDB.databases() shim (#555,\n        # engine-own and other-site names filtered out in-page) and\n        # the #543 fragment rides (vloc native-hash join, the\n        # navEncode/makeRel fragment splits); measured 41025,\n        # baseline 40570.\n        # Raised 41216 -> 41408 for #538: the swshim page base\n        # Raised 41408 -> 41600 for #533: virtual-origin child-proxy realm cache\n        # Raised 41600 -> 41792 for #533: origin-keyed child-slot cache;\n        # 41792 -> 43520 for #537: blob-worker /zl-bw/ route head and the\n        # page-side wrap helpers ride bootstrap.js (measured 42768).\n        # 43520 -> 44574 for #532: virtual document.baseURI view (zl:vbase\n        # delivery, about:srcdoc faithful view, resolveBase machinery);\n        # measured 44382.\n        # 44574 -> 46357 for #534: cookieStore facade (cookiestore.ts\n        # module + isolation install) and schemeful same-site matching;\n        # measured 46170.\n        # 46357 -> 47480 for #576: truthful registration - the swshim\n        # zl:decodeRoutes engine-arg oracle, the bounded readyVirtualBase\n        # poll and the register forward wiring ride bootstrap.js;\n        # measured 47288, baseline 46170.\n        # 47480 -> 48480 for #579: flag-surgery recovery (distinct-target\n        # budget) and mss path-shape recovery ride bootstrap.js via\n        # assetbases.ts; measured 48413, baseline 47288.\n        # 47480 -> 48000 for #536: the pre-existing open shadow-root\n        # sweep (join already-open roots to the MutationObserver at\n        # nav-guard install) rides bootstrap.js via navguard.ts;\n        # measured 47920, baseline 47288.\n        # 48480 -> 49280 at the #591 merge: the #536 sweep delta (632\n        # bytes over baseline 47288) stacks on the #579 measured\n        # 48413; measured 49301 (run 41349264039), 21 bytes over\n        # the 49280 estimate-gate; corrected at the #586 merge.\n        # 47480 -> 47760 for #553: the popup WindowProxy facade rides\n        # bootstrap.js - the synchronous window.open return contract\n        # forbids lazy shipping (finder/dominspect-style), so the\n        # facade factory, its name-reuse registry and the close-report\n        # wiring are bootstrap-resident; measured 47671, baseline 47288.\n        # 49280 -> 49800 at the #586 merge: the corrected #591\n        # measured 49301 plus the #553 facade delta (383 bytes over\n        # baseline 47288, branch-measured 47671); estimate 49684,\n        # to be corrected to the measured value CI prints.\n        # resolves lazily (virtual-origin marker + injected vpath\n        # at call time) so a page's relative register() lands on the\n        # page's virtual URL; measured 41310, baseline 41025.\n        run: |\n          SIZE=$(wc -c < app/dist/bootstrap.js)\n          echo \"bootstrap.js: $SIZE bytes\"\n          if [ \"$SIZE\" -ge 49800 ]; then echo \"::error::BOOTSTRAP $SIZE bytes (budget 49800)\"; exit 1; fi\n      - name: Finder size budget (must stay under 4 KiB minified)\n        # #29: dist/finder.js is shipped into the page inside the\n        # first zl:findLoad message, so its size is a per-command\n        # payload. Deliberate own gate: the finder never competes with\n        # the bootstrap budget - the bootstrap only carries the\n        # loader (bootstrap/findload.ts).\n        run: |\n          SIZE=$(wc -c < app/dist/finder.js)\n          echo \"finder.js: $SIZE bytes\"\n          if [ \"$SIZE\" -ge 4096 ]; then echo \"::error::FINDER $SIZE bytes (budget 4096)\"; exit 1; fi\n      - name: Classic-artifact gate (browser-runtime bundle formats)\n        # The bootstrap is injected as a classic <script src>, the\n        # worker prelude is prepended to classic worker scripts and the\n        # finder is eval'd in the page: none of these contexts can\n        # parse ESM syntax. The first real-browser run (issue #35)\n        # failed on exactly this: every artifact was emitted as an ES\n        # module, so the SW never evaluated, the bootstrap never\n        # loaded and workers died on an injected import statement.\n        # sw.js is the deliberate exception: it is registered with\n        # type: \"module\" (src/engine.ts).\n        run: |\n          cd app\n          for f in dist/bootstrap.js dist/worker-prelude.js dist/finder.js; do\n            if [ ! -f \"$f\" ]; then echo \"::error::CLASSIC missing artifact $f\"; exit 1; fi\n            BAD=$(grep -nE '(^|[;}])(import|export)[ { ]' \"$f\" | head -3 || true)\n            if [ -n \"$BAD\" ]; then\n              echo \"$BAD\" | while IFS= read -r l; do echo \"::error::CLASSIC ESM statement in $f: $l\"; done\n              exit 1\n            fi\n          done\n          echo \"classic artifacts: import/export-free\"\n      - name: Subpath-alias build gate (2.1 Halogen)\n        # The adapter serves the DEFAULT-base dist bundle under the\n        # /zlsw/ path. An asset URL frozen to the origin root 404s there\n        # and every proxied document dies silently (commit 6e9d395 fixed\n        # exactly this; a first attempt at this gate built with\n        # --base=/zlsw/, which legitimately produces /zlsw/-prefixed\n        # refs and false-fails). Statically assert the built SW\n        # references no origin-root engine-asset path and resolves\n        # against its own script URL.\n        run: |\n          cd app\n          PAT=$'[\"\\']/(zlsw/)?(rewriter_wasm|wisp_wasm|seam_wasm|adblock_wasm|prelude|libcurl)'\n          BAD=$(grep -oE \".{0,40}$PAT.{0,50}\" dist/sw.js || true)\n          if [ -n \"$BAD\" ]; then\n            echo \"$BAD\" | head -9 | while IFS= read -r l; do echo \"::error::SUBPATH origin-root asset URL in sw.js: $l\"; done\n            exit 1\n          fi\n          if ! grep -q 'location\\.href' dist/sw.js; then\n            echo \"::error::SUBPATH sw.js never references location.href; asset resolution is not SW-relative\"\n            exit 1\n          fi\n      - uses: actions/upload-artifact@v4\n        with:\n          name: zeolite-app\n          path: app/dist/\n      # Publish the engine bundle for same-origin embedders: the dist\n      # branch always carries the newest green main build (sw.js and\n      # its chunks/assets). The vendored libcurl transport is stripped\n      # first: the AGPL bundle is never committed to git; embedders\n      # pull it from npm at their own build time, same as this CI.\n      - name: Publish engine bundle branch (dist)\n        if: github.ref == 'refs/heads/main' && github.event_name == 'push'\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          rm -rf app/dist/libcurl app/dist/epoxy\n          # Fresh repo in a temp dir: only the dist files land on the\n          # branch, no build intermediates from the checkout worktree.\n          rm -rf /tmp/bundle && mkdir -p /tmp/bundle\n          cp -r app/dist/. /tmp/bundle/\n          cd /tmp/bundle\n          git init -q -b dist .\n          git config user.name \"zeolite-ci\"\n          git config user.email \"ci@zeolite.invalid\"\n          git add -A\n          git commit -q -m \"engine bundle: build ${GITHUB_RUN_ID}\"\n          git push -f \"https://x-access-token:${GITHUB_TOKEN}@github.com/lobsterbs/Zeolite.git\" HEAD:dist\n\n  compat:\n    # Needs a built engine. Runs on every push to main as well as the\n    # nightly schedule and workflow_dispatch: GitHub's scheduler dropped\n    # the 03:00 and 03:23 UTC crons (schedule runs exist only for Sep\n    # 26/27, and both were hours late), and workflow_dispatch is 403 for\n    # the automation account, so push is the only reliable trigger.\n    # Real-site probes are report-only since 2.5 Iodide - their\n    # Real-site probes are report-only since 2.5 Iodide - their\n    # failures open issues and never gate, because flaky external\n    # targets must not break CI. The fixture-based capability gates\n    # and the replay comparison stay hard gates.\n    if: github.event_name != 'pull_request'\n    runs-on: ubuntu-latest\n    # The first wisp-based run deadlocked for 36 minutes before being\n    # cancelled by hand; a hung probe must fail loudly, not at 6 hours.\n    timeout-minutes: 20\n    needs: [rust]\n    permissions:\n      contents: write # scoreboard branch publish\n      issues: write # failed real-site probes file issues\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - name: Build server, run probes locally\n        # The probes drive zeolite-server over plain HTTP; no SW app\n        # build is needed (the server starts without --static, and the\n        # old app-build lines could never have worked: sw.ts imports\n        # the wasm artifacts that only the wasm job's artifact carries,\n        # not a bare checkout - the first ever compat run died there).\n        run: |\n          cargo build -p zeolite-server --release --locked\n          # ZL_TEST_ALLOW_PRIVATE_DESTS=1 + ZL_TEST_EGRESS=1: the\n          # two-key test-only policy escape hatch (#213) so the engine\n          # may reach the local fixture origin. One stray variable\n          # alone disables nothing; the default stays locked down.\n          ZL_TEST_ALLOW_PRIVATE_DESTS=1 ZL_TEST_EGRESS=1 ./target/release/zeolite-server --port 6002 &\n          sleep 2\n          node suite/probe.mjs --base http://localhost:6002\n          node suite/capabilities.mjs --base http://localhost:6002\n          # --fixture: resolve the session's %FIXTURE% tokens against\n          # the live fixture loopback host:port; without it the tokens\n          # stay literal hostnames and every replay fails.\n          node suite/replay.mjs --base http://localhost:6002 --fixture\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: zeolite-scoreboard\n          path: |\n            suite/scoreboard.*\n            suite/capabilities.*\n      # 2.5 Iodide: a failing real-site probe opens one deduplicated\n      # issue per site (title search, so a persistently failing site\n      # keeps a single open issue instead of one per nightly run).\n      # The issue is closed by hand once the site passes again. This\n      # step never fails the job; neither do the probes themselves.\n      - name: Open issues for failed real-site probes\n        if: always()\n        env:\n          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        run: |\n          if [ ! -f suite/scoreboard.json ]; then\n            echo \"no scoreboard produced; nothing to file\"\n            exit 0\n          fi\n          FAILS=$(jq -r '.results[] | select(.status == \"fail\") | .name' suite/scoreboard.json)\n          if [ -z \"$FAILS\" ]; then\n            echo \"all real-site probes passed\"\n            exit 0\n          fi\n          for SITE in $FAILS; do\n            TITLE=\"compat-probe: $SITE failing\"\n            N=$(gh issue list --repo \"$GITHUB_REPOSITORY\" --state open --search \"$TITLE\" --json number --jq 'length')\n            if [ \"$N\" = \"0\" ]; then\n              NOTE=$(jq -r --arg s \"$SITE\" '.results[] | select(.name == $s) | \"error: \\(.error // \"(none)\") ratio: \\(.ratio // \"-\")\"' suite/scoreboard.json)\n              BODY=$(printf 'Nightly real-site probe failed (run %s).\\n\\n%s\\n\\nFull results: scoreboard branch, scoreboard.json.' \"$GITHUB_RUN_ID\" \"$NOTE\")\n              gh issue create --repo \"$GITHUB_REPOSITORY\" --title \"$TITLE\" --body \"$BODY\" || true\n              echo \"opened issue for $SITE\"\n            else\n              echo \"open issue already exists for $SITE\"\n            fi\n          done\n      # Publish the scoreboard as a public page (Phase 4): the latest\n      # JSON + Markdown land on the \"scoreboard\" branch, force-updated\n      # so the branch always reflects the newest nightly run.\n      - name: Publish scoreboard branch\n        if: always()\n        run: |\n          if [ ! -f suite/scoreboard.json ]; then\n            echo \"no scoreboard produced; skipping publish\"\n            exit 0\n          fi\n          git config user.name \"zeolite-ci\"\n          git config user.email \"ci@zeolite.invalid\"\n          git checkout --orphan scoreboard\n          git rm -rf --quiet . || true\n          cp suite/scoreboard.json suite/scoreboard.md suite/capabilities.json suite/capabilities.md . 2>/dev/null || cp suite/scoreboard.json .\n          git add scoreboard.* capabilities.* || git add scoreboard.*\n          git commit -m \"scoreboard: nightly compat run ${GITHUB_RUN_ID}\"\n          git push -f origin HEAD:scoreboard\n\n  browser:\n    # Issue #35: a genuine Chromium browser job. The transport-level\n    # compat suite cannot see SW interception, the bootstrap shims,\n    # the rewriter's page seams or the #32/#34 privacy properties, so\n    # browser-only failures survived CI. Fixtures-only (no third-party\n    # sites) on purpose; the harness fails loudly with the engine\n    # server's output tail. Run on PRs as well: rewrite and security\n    # changes need Chromium acceptance before merge.\n    # 2026-11-01: the merge-wave cleanup window ran five-plus ci runs\n    # concurrently; runs 41351728517 (700 ms TTFB torture), 41352289075\n    # (#545 worker initiator + navigation cascade) and 41352245827\n    # (redirect probe fetch never settled + cascade) each failed a\n    # different timing suite on identical engine content - recorded as\n    # runner-load flakes like the 1279 blob-worker class. This comment\n    # commit retriggers a contention-free run on the same tree.\n\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    needs: wasm\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/download-artifact@v4\n        with:\n          name: zeolite-wasm\n          path: app/src/\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n      - name: Vendor libcurl transport (same pin as the app job)\n        run: |\n          npm install --prefix .vendor @mercuryworkshop/libcurl-transport@2.0.6\n          mkdir -p app/public/libcurl\n          cp -r .vendor/node_modules/@mercuryworkshop/libcurl-transport/dist/. app/public/libcurl/\n          npm install --prefix .vendor @mercuryworkshop/epoxy-tls@2.1.20-1\n          mkdir -p app/public/epoxy\n          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.js app/public/epoxy/epoxy.js\n          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.wasm app/public/epoxy/epoxy.wasm\n      - name: Build engine bundle\n        run: |\n          cd app\n          npm install\n          npm run build\n      - name: Build zeolite-server\n        run: cargo build -p zeolite-server --release --locked\n      - name: Install Playwright Chromium\n        run: |\n          cd suite/e2e\n          npm install\n          npx playwright install --with-deps chromium\n      - name: WebSocket closing buffered bytes vs Chromium (#462)\n        run: node suite/e2e/ws-buffered.mjs\n      - name: WebSocket negotiation/close-order/slow-drain differential vs Chromium (#546)\n        run: node suite/e2e/ws-negotiation.mjs\n      - name: Location policy Chromium + WASM fixture (#456)\n        run: node suite/e2e/location-policy.mjs\n      - name: Location targeting corroborated mark + scoreboard (#456 gate 4)\n        run: node suite/e2e/location-targeting.mjs\n      - name: Virtual document base suite (#532)\n        run: node suite/e2e/baseuri.mjs\n      - name: Live-corpus location targeting measurement (#456, report-only)\n        run: node suite/e2e/location-targeting-live.mjs\n      - name: Upload live location targeting measurement (#456)\n        uses: actions/upload-artifact@v4\n        with:\n          name: location-targeting-measurement\n          path: suite/location-targeting.json\n      - name: Browser E2E suite (issue #35)\n        run: |\n          node suite/e2e/e2e.mjs 2>&1 | tee browser.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" browser.out | head -20 | while IFS= read -r l; do echo \"::error::E2E $l\"; done\n            exit 1\n          fi\n      - name: Torture suite (issue #92)\n        run: |\n          node suite/e2e/torture.mjs 2>&1 | tee torture.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" torture.out | head -40 | while IFS= read -r l; do echo \"::error::TORTURE $l\"; done\n            exit 1\n          fi\n      - name: Reload-count suite (refresh-spam regression)\n        run: |\n          node suite/e2e/reload-count.mjs 2>&1 | tee reload.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" reload.out | head -20 | while IFS= read -r l; do echo \"::error::RELOAD $l\"; done\n            exit 1\n          fi\n      - name: Guest service-worker lifecycle suite (#538)\n        # Real-Chromium acceptance of the guest SW lifecycle: register\n        # spawns the realm, caches serve repeat fetches, update swaps\n        # the realm, unregister returns the engine path. Ports\n        # 6009/7109 never collide with the e2e.mjs suite.\n        run: |\n          node suite/e2e/guest-sw.mjs 2>&1 | tee guest.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" guest.out | head -20 | while IFS= read -r l; do echo \"::error::GUEST-SW $l\"; done\n            exit 1\n          fi\n      - name: Computed-URL sink differential suite (#525)\n        # Direct-vs-proxied acceptance for runtime-computed URL\n        # operands (fetch, dynamic import, element property, Worker,\n        # module Worker, WebSocket, postMessage target): every case\n        # must settle with the same value in both modes and the\n        # upstream hit sets must match. Ports 6023/7123 never collide\n        # with e2e.mjs (6002/7101) or guest-sw (6009/7109).\n        run: |\n          node suite/e2e/computed-sinks.mjs 2>&1 | tee csink.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" csink.out | head -20 | while IFS= read -r l; do echo \"::error::CSINK $l\"; done\n            exit 1\n          fi\n      - name: Large streamed-body redirect replay suite (#556)\n        # Direct-vs-proxied acceptance for redirect replay of large\n        # streamed bodies through the host-authorized OPFS spool:\n        # below and above the 32 MiB memory cap for every redirect\n        # kind, cross-origin hops, Authorization drops, and SHA-256\n        # content verification. Ports 6025/7125/7126 never collide\n        # with the other suites.\n        # TEMPORARY (tracked under #556): this suite wedges deterministically\n        # in CI and has never been green since it landed; it starved every\n        # later browser suite of its run and burned the full 30-minute job\n        # timeout on each push. Keep the failure loud (annotations) but\n        # bounded and non-blocking so the #527/#533/#535/#537 suites still\n        # execute. Restore the hard gate when the #556 fix lands.\n        # 2026-11-02 (run 41437602567): TERM alone is not enough. When\n        # the suite's Chromium dies mid-run the harness prints its\n        # summary but its own SIGTERM teardown deadlocks, so timeout's\n        # TERM never reaps node, tee never sees EOF and the step hangs\n        # until the job's own timeout-minutes: 30 cancels the whole run\n        # (conclusion \"cancelled\"; orphans timeout/tee/node at cleanup).\n        # -k 30 force-kills 30 s after TERM; the step-level 12-minute\n        # bound below is the second line of defense so a wedged RSPOOL\n        # can never burn the whole job again.\n        timeout-minutes: 12\n        continue-on-error: true\n        run: |\n          timeout -k 30 480 node suite/e2e/replay-spool.mjs 2>&1 | tee rspool.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" rspool.out | head -20 | while IFS= read -r l; do echo \"::error::RSPOOL $l\"; done\n            echo \"::error::RSPOOL exited $code (bounded 480s, non-blocking until #556 lands)\"\n            exit 1\n          fi\n      - name: CSP enforcement differential suite (#527)\n        # Direct-vs-proxied acceptance for the opt-in deny-only CSP\n        # translation: enforced and unsupported decisions are visible\n        # (x-zl-csp), the block-class violation set matches the direct\n        # browser oracle while the allow side stays intact, unsupported\n        # policies stay stripped and never widen, and meta policies\n        # stay consistent with the header path. Ports 6026/7127 never\n        # collide with the other suites.\n        run: |\n          node suite/e2e/csp-enforce.mjs 2>&1 | tee csp.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" csp.out | head -20 | while IFS= read -r l; do echo \"::error::CSP $l\"; done\n            exit 1\n          fi\n      - name: Virtual-origin postMessage suite (#533)\n        # Direct-vs-proxied acceptance for the virtual-origin\n        # messaging seam: nested-frame ev.source identity converges\n        # with iframe.contentWindow (the __zlCP child slot keyed\n        # by the minting realm origin), MessageChannel port\n        # transfers work both ways, cross-site storage stays\n        # partitioned while the proxied cross contentDocument\n        # readability divergence is pinned, and opaque-sandbox\n        # frames that bypass the engine receive the bypass notice.\n        # Ports 6027/7128/7129 never collide with the other suites.\n        run: |\n          node suite/e2e/vorigin-msg.mjs 2>&1 | tee vorigin.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" vorigin.out | head -20 | while IFS= read -r l; do echo \"::error::VORIGIN $l\"; done\n            exit 1\n          fi\n      - name: srcdoc client classes suite (#528)\n        # Direct-vs-proxied acceptance for the srcdoc client\n        # classes: current Chromium makes about:srcdoc documents\n        # service-worker clients (the crbug.com/41411856\n        # limitation no longer reproduces; verified at 156), so a\n        # plain recording SW must see every srcdoc parser class\n        # (script, module, stylesheet, image, css url(), nested\n        # srcdoc) plus the child runtime fetch, and the engine must\n        # serve the same classes end to end through its SW decode\n        # pipeline. The about:blank parent-written document.write\n        # child stays the remaining uncontrolled class (never\n        # SW-bound) and 404s on the engine static server. Ports\n        # 6031/7131 never collide with the other suites.\n        run: |\n          node suite/e2e/srcdoc-clients.mjs 2>&1 | tee srcdocc.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\\\[FAIL\\\\]|HARNESS-ERROR\" srcdocc.out | head -20 | while IFS= read -r l; do echo \"::error::SRCDCC $l\"; done\n            exit 1\n          fi\n      - name: Raw-block buffering suite (#526)\n        # Real-Chromium acceptance for the bounded raw-block\n        # buffering contract: normal inline styles are rewritten\n        # (engine routes, no fixture-origin leak) and apply, an\n        # over-cap (RAW_PASS_CAP + 64 KiB) inline style and script\n        # are served verbatim, complete and fail-open (tail rule\n        # applies, tail line executes, exact served lengths), and\n        # the measurable TTFB gate proves a marker before an\n        # unterminated 6 MiB raw block becomes visible while the\n        # bulk still streams, with bounded completion. Ports\n        # 6043/7143 never collide with the other suites.\n        run: |\n          node suite/e2e/raw-caps.mjs 2>&1 | tee rawcaps.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\\\[FAIL\\\\]|HARNESS-ERROR\" rawcaps.out | head -20 | while IFS= read -r l; do echo \"::error::RAWCAPS $l\"; done\n            exit 1\n          fi\n      - name: Virtual context restart suite (#535)\n        # Real-Chromium restart acceptance: two tabs on two virtual\n        # sites lose the in-memory context map when the engine worker\n        # stops, and each tab's next relative subresource must\n        # rehydrate its own context from its own browser-committed\n        # client URL; the sites must never inherit each other's\n        # contexts, and the referrer compat control stays served.\n        # Ports 6034/7134/7135 never collide with the other suites.\n        run: |\n          node suite/e2e/vctx-restart.mjs 2>&1 | tee vctxr.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" vctxr.out | head -20 | while IFS= read -r l; do echo \"::error::VTXR $l\"; done\n            exit 1\n          fi\n      - name: Blob worker suite (#537)\n        # Real-Chromium acceptance for page-created blob workers:\n        # Chromium serves blob: worker scripts from the blob store\n        # with no fetch event, so the SW prelude cannot reach them;\n        # the page wrap serves them the /zl-bw/ prelude instead.\n        # Classic, module and nested workers must boot with the\n        # page site token and virtual base, ride engine routes,\n        # and keep the site-scoped DB namespace. Ports 6034/7134\n        # are shared with vctx-restart sequentially, never with the\n        # parallel suites.\n        # 2026-10-31: run 1279 failed 8/16 here on an extensions-only push\n        # (5aee1975, the page wrap absent for one proxied page); run 1278\n        # was green on the parent commit and three local runs on the\n        # identical tree passed 16/16, so this is recorded as the\n        # suite first CI flake and this commit retriggered the run.\n        run: |\n          node suite/e2e/blob-workers.mjs 2>&1 | tee blobw.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" blobw.out | head -20 | while IFS= read -r l; do echo \"::error::BLOBW $l\"; done\n            exit 1\n          fi\n      - name: Subresource integrity suite (#531)\n        # Real-Chromium acceptance for engine-side SRI: the rewriter\n        # drops browser-facing integrity attributes, so the engine\n        # verifies fresh script/stylesheet bytes against the document\n        # scan registry. Valid SRI loads proxied and direct, a\n        # tampered upstream body blocks in BOTH modes, an unsupported\n        # algorithm falls back to the compatibility serve (parity with\n        # Chromium), a redirect hashes the final body, and a second\n        # navigation re-serves the cached document and still blocks the\n        # tampered script. Ports 6041/7141 never collide.\n        run: |\n          node suite/e2e/sri.mjs 2>&1 | tee sri.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\\\[FAIL\\\\]|HARNESS-ERROR\" sri.out | head -20 | while IFS= read -r l; do echo \"::error::SRI $l\"; done\n            exit 1\n          fi\n      - name: Import map suite (#554)\n        # Real-Chromium acceptance for import-map awareness: the wasm\n        # rewriter keeps page import maps resolvable (values ride engine\n        # routes, bare keys stay), and the engine records each served\n        # document's map so module workers resolve bare specifiers\n        # through the owning page's map at the serve seam; unknown bare\n        # specifiers still fail natively. Ports 6036/7136 never collide.\n        run: |\n          node suite/e2e/importmap.mjs 2>&1 | tee impmap.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\\\[FAIL\\\\]|HARNESS-ERROR\" impmap.out | head -20 | while IFS= read -r l; do echo \"::error::IMPMAP $l\"; done\n            exit 1\n          fi\n      - name: Injector differential suite (queryRoutes off vs on)\n        run: |\n          node suite/e2e/differential.mjs 2>&1 | tee diff.out\n          code=${PIPESTATUS[0]}\n          if [ \"$code\" -ne 0 ]; then\n            grep -E \"^\\[FAIL\\]|HARNESS-ERROR\" diff.out | head -20 | while IFS= read -r l; do echo \"::error::DIFF $l\"; done\n            exit 1\n          fi\n"}}]