name: zeolite

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# The engine-bundle publish step pushes the dist branch with the
# workflow token; the repo default grants it read-only.
permissions:
  contents: write # nightly compat suite



jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - name: clippy
        # CARGO_TERM_COLOR=never: the error grep below must match real
        # "error"/"warning" line starts. With color enabled every error
        # line starts with an ANSI escape and the gate silently passes.
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.out 2>&1 || true
          tail -c 16000 clippy.out || true
          # Cargo own "spurious network error" retry warnings (a crates.io
          # flake) start with "warning:" and are not lints: filter them or
          # a network retry fails a clean run (run 38074371590).
          grep -E "^(error|warning)(\[|:)" clippy.out | grep -v "spurious network error" > clippyfail.out || true
          head -9 clippyfail.out | while IFS= read -r l; do echo "::error::CLIPPY $l"; done
          if [ -s clippyfail.out ]; then exit 1; fi
      - name: test
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --workspace --locked > test.out 2>&1 || true
          tail -c 16000 test.out || true
          grep -m1 -B6 -A14 -E "^error|FAILED|panicked at" test.out > testslice.out || true
          if [ -s testslice.out ]; then
            D=$(head -c 900 testslice.out | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::TEST%0A$D"
            exit 1
          fi
      - run: cargo check -p zeolite-rewriter -p zeolite-wisp --target wasm32-unknown-unknown --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack (pinned prebuilt)
        # cargo install wasm-pack 0.13.1 stopped resolving on 2026-10-16:
        # every zip 2.x release its binary-install dep accepts was
        # yanked from crates.io, so the install failed and the || true
        # moved the failure into the build step. The pinned prebuilt
        # tarball has no crates.io dependency surface at all.
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo mv /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build rewriter wasm
        run: |
          if ! wasm-pack build crates/rewriter --target web --release --out-name rewriter_wasm > wasm1.out 2>&1; then
            D=$(grep -m1 -A10 -i "error" wasm1.out | head -c 700 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::REWASM%0A$D"
            exit 1
          fi
          mkdir -p app/src/rewriter_wasm
          cp crates/rewriter/pkg/rewriter_wasm* app/src/rewriter_wasm/
      - name: Build wisp wasm
        run: |
          if ! wasm-pack build crates/wisp-wasm --target web --release --out-name wisp_wasm > wasm2.out 2>&1; then
            D=$(grep -m1 -A10 -i "error" wasm2.out | head -c 700 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::WIWASM%0A$D"
            exit 1
          fi
          mkdir -p app/src/wisp_wasm
          cp crates/wisp-wasm/pkg/wisp_wasm* app/src/wisp_wasm/
      - name: Measure wasm bundles (record; budget enforcement is the Phase 1 gate)
        run: du -b app/src/rewriter_wasm/rewriter_wasm_bg.wasm app/src/wisp_wasm/wisp_wasm_bg.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: zeolite-wasm
          path: app/src/

  app:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zeolite-wasm
          path: app/src/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vendor the libcurl transport (TLS terminates client-side in
      # libcurl.js; the SW cannot do TLS). The package is AGPL-3.0-only
      # with a ~2.1 MB bundled dist, so it is never committed: CI pulls a
      # pinned version and copies it into app/public/libcurl, where the
      # committed adapter (src/libcurl-transport-vendored.ts) loads it
      # at runtime. Deployments serving the built engine inherit AGPL
      # obligations for that bundle and its combined work.
      - name: Vendor libcurl transport
        run: |
          {
            npm install --prefix .vendor @mercuryworkshop/libcurl-transport@2.0.5 &&
            mkdir -p app/public/libcurl &&
            cp -r .vendor/node_modules/@mercuryworkshop/libcurl-transport/dist/. app/public/libcurl/
          } 2>&1 | tee vendor.out
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            D=$(tail -c 700 vendor.out | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::VENDOR%0A$D"
            exit 1
          fi
          ls -la app/public/libcurl
      # Vendor the epoxy transport (selectable second engine, #64).
      # Same never-committed rule as libcurl: the package is
      # AGPL-3.0-only too (verified in npm metadata 2.1.20-1), so the
      # bundle is pulled pinned at build time only. Full variant (#64 slice 3): the WebSocket
      # bridge + gzip/brotli + HTTP/2 sit behind the package "full"
      # build; minimal has fetch only, so a WS open under the epoxy
      # engine would fail on a minimal vendor.
      - name: Vendor epoxy transport
        run: |
          {
            npm install --prefix .vendor @mercuryworkshop/epoxy-tls@2.1.20-1 &&
            mkdir -p app/public/epoxy &&
            cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.js app/public/epoxy/epoxy.js &&
            cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.wasm app/public/epoxy/epoxy.wasm
          } 2>&1 | tee epoxy.out
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            D=$(tail -c 700 epoxy.out | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::EPOXY%0A$D"
            exit 1
          fi
          ls -la app/public/epoxy
      - name: SW-scope loading lint (no dynamic import in SW-reachable code)
        # Chromium forbids import() on ServiceWorkerGlobalScope and the
        # failure only appears at runtime (commit 73463a4 fixed exactly
        # this). Engine code under app/src must never call import() with
        # a string literal. Page-context entries are exempt: import()
        # is legal where they run. Content scripts served into pages may
        # need an exemption later; add it here, do not weaken the gate.
        run: |
          cd app
          PAT=$'import[[:space:]]*\\([[:space:]]*["\'`]'
          HITS=$(grep -rnE "$PAT" src --include='*.ts' | grep -v '__tests__' | grep -vE 'src/(main|devtools|bootstrap)\.ts' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | head -9 | while IFS= read -r l; do echo "::error::SWIMPORT $l"; done
            exit 1
          fi
      - name: typecheck + build
        run: |
          cd app && npm install
          npx tsc --noEmit > tsc.out 2>&1 || true
          grep -E "error TS" tsc.out | head -9 | while IFS= read -r l; do echo "::error::TSC $l"; done
          if grep -q "error TS" tsc.out; then exit 1; fi
          npm run build
      - name: Extension subsystem unit tests
        # Wall-clock guard: a wedged vitest (open handles keep the
        # process alive past the per-test timeouts) must fail the run
        # in minutes with its last output, not hang the job for 6h.
        run: |
          cd app
          rm -f vitest.out
          code=0
          timeout 300 npx vitest run --reporter=default > vitest.out 2>&1 || code=$?
          if [ "$code" -ne 0 ]; then
            if [ "$code" -eq 124 ]; then
              echo "::error::VITEST still running after 300s and was killed; last output below"
            fi
            grep -E "FAIL|AssertionError|Error:" vitest.out | head -9 | while IFS= read -r l; do echo "::error::VITEST $l"; done
            tail -40 vitest.out
            exit 1
          fi
      - name: Verify vendored transport made it into the build
        run: |
          test -f app/dist/libcurl/index.mjs
          test -f app/dist/epoxy/epoxy.js
          test -f app/dist/epoxy/epoxy.wasm
      - name: Bootstrap size budget (must stay under 28 KiB minified)
        # Raises are deliberate decisions recorded here, never quiet
        # accommodations; CI prints the measured size. Every raise bought
        # per-page correctness that cannot ride outside the one artifact
        # the page loads: #28/#35 nav guard + classic-file split, #37
        # cross-site channel isolation, #58/#59 srcdoc + setAttribute,
        # #54 page-realm mint client + Worker hooks, #101 child-realm
        # re-emit, #106/#108 popup guard + child isolation, #109 popup
        # sync-open + relative nav re-emit, #121 engineUpdate reload
        # listener, #128 legacy WebKit postMessage, #130/#132 frame
        # identity relabel races, #236 virtual location, #248 the
        # route-shaped vloc decode (prel-of-prel stack prevention).
        # Raised 28672 -> 29696 for the #268/#269/#273/#274/#275/#284
        # bootstrap compat wave (listener-object relabel + tap
        # filter, BroadcastChannel subclass, Storage named-property
        # Proxy, EventSource listener registry, Worker subclasses);
        # measured 29383.
        # Raised 29696 -> 30400 for the #364/#371/#372/#373/#374/#375
        # bootstrap wave (srcdoc script-body split, noopener popup
        # route, postMessage options form, ws scheme SyntaxError,
        # backslash-origin vloc); measured 30349, baseline 29649.
        # Raised 30400 -> 31744 for the #107 phase 2 embedder URL/title
        # sync module; measured 31406, baseline 30381.
        # Raised 31744 -> 33792 for the #180 anchor read
        # virtualization (Injector phase 1: bootstrap anchorshim +
        # the zl:decodeRoutes oracle); measured 33782, baseline 31406.
        # Raised 33792 -> 34304 for the #387/#388 follow-up (scan
        # window skip-memoized paging + the SVG animated-href read
        # seam); measured 34294, baseline 33782.
        # Raised 34304 -> 34816 for the #182 location member-write
        # view setters (hash/search/pathname); measured 34628,
        # baseline 34294.
        # Raised 34816 -> 35328 for the Injector phase 2 query-shape
        # vloc re-anchors (native-path commits keep the zlNavh
        # token); measured 35113, baseline 34628.
        # Raised 35328 -> 36352 for the wave-56 bootstrap rides: the
        # ws subprotocol allow-list call repair (#419, the blooket
        # Colyseus class) and the anchor read scan order fix (#418,
        # attribute before absolute); measured 35662, baseline 35113.
        # Raised 36352 -> 37888 for registered-embedder popup routing
        # and client/icon metadata (#416/#428). The strict byte gate
        # remains; measure the complete bundle after each change.
        # #497 retains the 39424 gate after reconciling main's anchor
        # and embedder recovery fixes. Share control-query cleanup rather
        # than accepting the integration's transient 41566-byte bundle.
        # Raised 37888 -> 39424 for the scout-wave listener
        # registries: capture-aware wrapper identity (#472 in
        # vorigin/relay) and storage once/signal/capture parity
        # (#475); measured 38471, baseline 37311.
        # Raised 39424 -> 39680 for #477 wave 3: the swshim
        # register/unregister forward to the engine controller
        # (guest spawn/unspawn); measured 39501.
        # Raised 39680 -> 40704 for #510: the URL parse seam -
        # inline-script route harvest + the wrapped URL constructor
        # serving decoded data-island destinations; measured 40570,
        # baseline 39501.
        # Raised 40704 -> 41216 for the storage + navigation
        # wave: the site-scoped indexedDB.databases() shim (#555,
        # engine-own and other-site names filtered out in-page) and
        # the #543 fragment rides (vloc native-hash join, the
        # navEncode/makeRel fragment splits); measured 41025,
        # baseline 40570.
        # Raised 41216 -> 41408 for #538: the swshim page base
        # Raised 41408 -> 41600 for #533: virtual-origin child-proxy realm cache
        # Raised 41600 -> 41792 for #533: origin-keyed child-slot cache;
        # 41792 -> 43520 for #537: blob-worker /zl-bw/ route head and the
        # page-side wrap helpers ride bootstrap.js (measured 42768).
        # 43520 -> 44574 for #532: virtual document.baseURI view (zl:vbase
        # delivery, about:srcdoc faithful view, resolveBase machinery);
        # measured 44382.
        # 44574 -> 46357 for #534: cookieStore facade (cookiestore.ts
        # module + isolation install) and schemeful same-site matching;
        # measured 46170.
        # 46357 -> 47480 for #576: truthful registration - the swshim
        # zl:decodeRoutes engine-arg oracle, the bounded readyVirtualBase
        # poll and the register forward wiring ride bootstrap.js;
        # measured 47288, baseline 46170.
        # 47480 -> 48480 for #579: flag-surgery recovery (distinct-target
        # budget) and mss path-shape recovery ride bootstrap.js via
        # assetbases.ts; measured 48413, baseline 47288.
        # resolves lazily (virtual-origin marker + injected vpath
        # at call time) so a page's relative register() lands on the
        # page's virtual URL; measured 41310, baseline 41025.
        run: |
          SIZE=$(wc -c < app/dist/bootstrap.js)
          echo "bootstrap.js: $SIZE bytes"
          if [ "$SIZE" -ge 48480 ]; then echo "::error::BOOTSTRAP $SIZE bytes (budget 48480)"; exit 1; fi
      - name: Finder size budget (must stay under 4 KiB minified)
        # #29: dist/finder.js is shipped into the page inside the
        # first zl:findLoad message, so its size is a per-command
        # payload. Deliberate own gate: the finder never competes with
        # the bootstrap budget - the bootstrap only carries the
        # loader (bootstrap/findload.ts).
        run: |
          SIZE=$(wc -c < app/dist/finder.js)
          echo "finder.js: $SIZE bytes"
          if [ "$SIZE" -ge 4096 ]; then echo "::error::FINDER $SIZE bytes (budget 4096)"; exit 1; fi
      - name: Classic-artifact gate (browser-runtime bundle formats)
        # The bootstrap is injected as a classic <script src>, the
        # worker prelude is prepended to classic worker scripts and the
        # finder is eval'd in the page: none of these contexts can
        # parse ESM syntax. The first real-browser run (issue #35)
        # failed on exactly this: every artifact was emitted as an ES
        # module, so the SW never evaluated, the bootstrap never
        # loaded and workers died on an injected import statement.
        # sw.js is the deliberate exception: it is registered with
        # type: "module" (src/engine.ts).
        run: |
          cd app
          for f in dist/bootstrap.js dist/worker-prelude.js dist/finder.js; do
            if [ ! -f "$f" ]; then echo "::error::CLASSIC missing artifact $f"; exit 1; fi
            BAD=$(grep -nE '(^|[;}])(import|export)[ { ]' "$f" | head -3 || true)
            if [ -n "$BAD" ]; then
              echo "$BAD" | while IFS= read -r l; do echo "::error::CLASSIC ESM statement in $f: $l"; done
              exit 1
            fi
          done
          echo "classic artifacts: import/export-free"
      - name: Subpath-alias build gate (2.1 Halogen)
        # The adapter serves the DEFAULT-base dist bundle under the
        # /zlsw/ path. An asset URL frozen to the origin root 404s there
        # and every proxied document dies silently (commit 6e9d395 fixed
        # exactly this; a first attempt at this gate built with
        # --base=/zlsw/, which legitimately produces /zlsw/-prefixed
        # refs and false-fails). Statically assert the built SW
        # references no origin-root engine-asset path and resolves
        # against its own script URL.
        run: |
          cd app
          PAT=$'["\']/(zlsw/)?(rewriter_wasm|wisp_wasm|prelude|libcurl)'
          BAD=$(grep -oE ".{0,40}$PAT.{0,50}" dist/sw.js || true)
          if [ -n "$BAD" ]; then
            echo "$BAD" | head -9 | while IFS= read -r l; do echo "::error::SUBPATH origin-root asset URL in sw.js: $l"; done
            exit 1
          fi
          if ! grep -q 'location\.href' dist/sw.js; then
            echo "::error::SUBPATH sw.js never references location.href; asset resolution is not SW-relative"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zeolite-app
          path: app/dist/
      # Publish the engine bundle for same-origin embedders: the dist
      # branch always carries the newest green main build (sw.js and
      # its chunks/assets). The vendored libcurl transport is stripped
      # first: the AGPL bundle is never committed to git; embedders
      # pull it from npm at their own build time, same as this CI.
      - name: Publish engine bundle branch (dist)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf app/dist/libcurl app/dist/epoxy
          # Fresh repo in a temp dir: only the dist files land on the
          # branch, no build intermediates from the checkout worktree.
          rm -rf /tmp/bundle && mkdir -p /tmp/bundle
          cp -r app/dist/. /tmp/bundle/
          cd /tmp/bundle
          git init -q -b dist .
          git config user.name "zeolite-ci"
          git config user.email "ci@zeolite.invalid"
          git add -A
          git commit -q -m "engine bundle: build ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/lobsterbs/Zeolite.git" HEAD:dist

  compat:
    # Needs a built engine. Runs on every push to main as well as the
    # nightly schedule and workflow_dispatch: GitHub's scheduler dropped
    # the 03:00 and 03:23 UTC crons (schedule runs exist only for Sep
    # 26/27, and both were hours late), and workflow_dispatch is 403 for
    # the automation account, so push is the only reliable trigger.
    # Real-site probes are report-only since 2.5 Iodide - their
    # Real-site probes are report-only since 2.5 Iodide - their
    # failures open issues and never gate, because flaky external
    # targets must not break CI. The fixture-based capability gates
    # and the replay comparison stay hard gates.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The first wisp-based run deadlocked for 36 minutes before being
    # cancelled by hand; a hung probe must fail loudly, not at 6 hours.
    timeout-minutes: 20
    needs: [rust]
    permissions:
      contents: write # scoreboard branch publish
      issues: write # failed real-site probes file issues
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server, run probes locally
        # The probes drive zeolite-server over plain HTTP; no SW app
        # build is needed (the server starts without --static, and the
        # old app-build lines could never have worked: sw.ts imports
        # the wasm artifacts that only the wasm job's artifact carries,
        # not a bare checkout - the first ever compat run died there).
        run: |
          cargo build -p zeolite-server --release --locked
          # ZL_TEST_ALLOW_PRIVATE_DESTS=1 + ZL_TEST_EGRESS=1: the
          # two-key test-only policy escape hatch (#213) so the engine
          # may reach the local fixture origin. One stray variable
          # alone disables nothing; the default stays locked down.
          ZL_TEST_ALLOW_PRIVATE_DESTS=1 ZL_TEST_EGRESS=1 ./target/release/zeolite-server --port 6002 &
          sleep 2
          node suite/probe.mjs --base http://localhost:6002
          node suite/capabilities.mjs --base http://localhost:6002
          # --fixture: resolve the session's %FIXTURE% tokens against
          # the live fixture loopback host:port; without it the tokens
          # stay literal hostnames and every replay fails.
          node suite/replay.mjs --base http://localhost:6002 --fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zeolite-scoreboard
          path: |
            suite/scoreboard.*
            suite/capabilities.*
      # 2.5 Iodide: a failing real-site probe opens one deduplicated
      # issue per site (title search, so a persistently failing site
      # keeps a single open issue instead of one per nightly run).
      # The issue is closed by hand once the site passes again. This
      # step never fails the job; neither do the probes themselves.
      - name: Open issues for failed real-site probes
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f suite/scoreboard.json ]; then
            echo "no scoreboard produced; nothing to file"
            exit 0
          fi
          FAILS=$(jq -r '.results[] | select(.status == "fail") | .name' suite/scoreboard.json)
          if [ -z "$FAILS" ]; then
            echo "all real-site probes passed"
            exit 0
          fi
          for SITE in $FAILS; do
            TITLE="compat-probe: $SITE failing"
            N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE" --json number --jq 'length')
            if [ "$N" = "0" ]; then
              NOTE=$(jq -r --arg s "$SITE" '.results[] | select(.name == $s) | "error: \(.error // "(none)") ratio: \(.ratio // "-")"' suite/scoreboard.json)
              BODY=$(printf 'Nightly real-site probe failed (run %s).\n\n%s\n\nFull results: scoreboard branch, scoreboard.json.' "$GITHUB_RUN_ID" "$NOTE")
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" || true
              echo "opened issue for $SITE"
            else
              echo "open issue already exists for $SITE"
            fi
          done
      # Publish the scoreboard as a public page (Phase 4): the latest
      # JSON + Markdown land on the "scoreboard" branch, force-updated
      # so the branch always reflects the newest nightly run.
      - name: Publish scoreboard branch
        if: always()
        run: |
          if [ ! -f suite/scoreboard.json ]; then
            echo "no scoreboard produced; skipping publish"
            exit 0
          fi
          git config user.name "zeolite-ci"
          git config user.email "ci@zeolite.invalid"
          git checkout --orphan scoreboard
          git rm -rf --quiet . || true
          cp suite/scoreboard.json suite/scoreboard.md suite/capabilities.json suite/capabilities.md . 2>/dev/null || cp suite/scoreboard.json .
          git add scoreboard.* capabilities.* || git add scoreboard.*
          git commit -m "scoreboard: nightly compat run ${GITHUB_RUN_ID}"
          git push -f origin HEAD:scoreboard

  browser:
    # Issue #35: a genuine Chromium browser job. The transport-level
    # compat suite cannot see SW interception, the bootstrap shims,
    # the rewriter's page seams or the #32/#34 privacy properties, so
    # browser-only failures survived CI. Fixtures-only (no third-party
    # sites) on purpose; the harness fails loudly with the engine
    # server's output tail. Run on PRs as well: rewrite and security
    # changes need Chromium acceptance before merge.

    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zeolite-wasm
          path: app/src/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor libcurl transport (same pin as the app job)
        run: |
          npm install --prefix .vendor @mercuryworkshop/libcurl-transport@2.0.5
          mkdir -p app/public/libcurl
          cp -r .vendor/node_modules/@mercuryworkshop/libcurl-transport/dist/. app/public/libcurl/
          npm install --prefix .vendor @mercuryworkshop/epoxy-tls@2.1.20-1
          mkdir -p app/public/epoxy
          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.js app/public/epoxy/epoxy.js
          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.wasm app/public/epoxy/epoxy.wasm
      - name: Build engine bundle
        run: |
          cd app
          npm install
          npm run build
      - name: Build zeolite-server
        run: cargo build -p zeolite-server --release --locked
      - name: Install Playwright Chromium
        run: |
          cd suite/e2e
          npm install
          npx playwright install --with-deps chromium
      - name: WebSocket closing buffered bytes vs Chromium (#462)
        run: node suite/e2e/ws-buffered.mjs
      - name: Location policy Chromium + WASM fixture (#456)
        run: node suite/e2e/location-policy.mjs
      - name: Location targeting corroborated mark + scoreboard (#456 gate 4)
        run: node suite/e2e/location-targeting.mjs
      - name: Virtual document base suite (#532)
        run: node suite/e2e/baseuri.mjs
      - name: Live-corpus location targeting measurement (#456, report-only)
        run: node suite/e2e/location-targeting-live.mjs
      - name: Upload live location targeting measurement (#456)
        uses: actions/upload-artifact@v4
        with:
          name: location-targeting-measurement
          path: suite/location-targeting.json
      - name: Browser E2E suite (issue #35)
        run: |
          node suite/e2e/e2e.mjs 2>&1 | tee browser.out
          code=${PIPESTATUS[0]}
