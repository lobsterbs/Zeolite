name: fix511-one-shot
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply the 511 patch (fail loud, never force)
        run: |
          git apply --check fix511.patch
          git apply fix511.patch
          git rm fix511.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack (pinned prebuilt)
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo mv /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build rewriter wasm
        run: |
          wasm-pack build crates/rewriter --target web --release --out-name rewriter_wasm
          mkdir -p app/src/rewriter_wasm
          cp crates/rewriter/pkg/rewriter_wasm* app/src/rewriter_wasm/
      - name: Build wisp wasm
        run: |
          wasm-pack build crates/wisp-wasm --target web --release --out-name wisp_wasm
          mkdir -p app/src/wisp_wasm
          cp crates/wisp-wasm/pkg/wisp_wasm* app/src/wisp_wasm/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor libcurl transport
        run: |
          npm install --prefix .vendor @mercuryworkshop/libcurl-transport@2.0.5
          mkdir -p app/public/libcurl
          cp -r .vendor/node_modules/@mercuryworkshop/libcurl-transport/dist/. app/public/libcurl/
      - name: Vendor epoxy transport
        run: |
          npm install --prefix .vendor @mercuryworkshop/epoxy-tls@2.1.20-1
          mkdir -p app/public/epoxy
          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.js app/public/epoxy/epoxy.js
          cp .vendor/node_modules/@mercuryworkshop/epoxy-tls/full/epoxy.wasm app/public/epoxy/epoxy.wasm
      - name: Gates (tsc, build, vitest)
        run: |
          cd app
          npm install
          npx tsc --noEmit
          npm run build
          timeout 300 npx vitest run --reporter=default
      - name: Commit and push the fix
        run: |
          git config user.name "zeolite-ship"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/request.ts app/src/__tests__/ctx-nav-clean.test.ts app/src/__tests__/request.test.ts
          git commit -m "fix(app): answer bare-path context navigations with the visible query-shape form (#511)" -m "A same-virtual-origin navigation the page performs through a native location write lands on the bare engine-origin path; the context recovery served the document there tokenless, so the page's own history writes re-anchored through the vloc navq-less prel mint and parked the URL on the opaque pathname, and pathname-routed SPAs rendered their catch-all (cyber.blooket's literal Game not found)." -m "Answer the GET navigation with one same-origin 302 to the visible query-shape handle form (real path + fresh zlNavh token), the same shape the initial navigation minted; the document then owns a readable URL and its history writes commit the real path natively. Fail-closed: no mint, an existing handle param, or a non-GET navigation keeps the direct serve." -m "Regression: ctx-nav-clean.test.ts (redirect, fetch, POST, no-key, query-off, next-hop decode); request.test.ts escaped-path test pins the new 302 + decode-back."
          git push
