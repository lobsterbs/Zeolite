name: apply-a2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-a2.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode patch
        run: echo '' | base64 -d > /tmp/a2.patch
      - name: apply patch
        run: git apply --check /tmp/a2.patch && git apply /tmp/a2.patch
      - name: commit fix
        run: |
          git config user.name "zeolite-ci"
          git config user.email "zeolite-ci@users.noreply.github.com"
          git add app/src/bootstrap/isolation.ts app/src/__tests__/isolation.test.ts app/src/transport.ts app/src/__tests__/transport-cooldown.test.ts
          git commit -m "fix(app): storage listener object-style isolation + relay TTFB deadline (#266, #261)"
          git push
      - name: remove workflow
        run: |
          git rm -q .github/workflows/apply-a2.yml
          git commit -q -m "chore: remove one-shot apply-a2 workflow"
          git push
