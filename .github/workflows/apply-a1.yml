name: apply-a1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-a1.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: decode patch
        run: echo '' | base64 -d > /tmp/a1.patch
      - name: apply patch
        run: git apply --check /tmp/a1.patch && git apply /tmp/a1.patch
      - name: commit fix
        run: |
          git config user.name "zeolite-ci"
          git config user.email "zeolite-ci@users.noreply.github.com"
          git add app/src/control.ts app/src/sw.ts app/src/engine.ts app/src/swstate.ts app/src/__tests__/control.test.ts app/src/__tests__/engine-init.test.ts app/src/__tests__/swstate.test.ts
          git commit -m "fix(app): control-plane lifecycle wave (#250, #252, #253)"
          git push
      - name: remove workflow
        run: |
          git rm -q .github/workflows/apply-a1.yml
          git commit -q -m "chore: remove one-shot apply-a1 workflow"
          git push
