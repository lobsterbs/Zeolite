name: apply-fix290
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-fix290.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch and remove the runner
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/b290.patch
          cat > /tmp/b290msg <<'ZLEOF'
          fix(app): name the requesting page in keyed-route decode diagnostics (#290)

          The keyed-route decode failure verdict recorded only the opaque
          tail length, so a live /sorry bot-wall script miss could not be
          attributed to the page that minted the token. The diag event now
          also carries the requesting page's virtual URL when the worker
          knows the client, and the failing route's full href.

          The ReferenceError itself is upstream in the captured wall
          variants: a direct capture of the sorry response (no engine in
          the path) has no defining script tags yet still carries the bare
          solveSimpleChallenge identifier check in body onload, so the
          ReferenceError class fires on direct too. No site-specific global
          stub is fabricated in the bootstrap; the diagnostic is the honest
          seam and the live-verification reopen condition is documented on
          the issue.

          Tests: keyed-route-diag.test.ts (3: page context named, absent
          context stays unattributed, url recorded). Full suite 1354
          passed, tsc clean.
          ZLEOF
          git config user.name 'lobsterbs'
          git config user.email 'dev@lobsterbs.dev'
          git apply --check /tmp/b290.patch
          git apply /tmp/b290.patch
          git rm -q .github/workflows/apply-fix290.yml
          git add -A
          git commit -q -F /tmp/b290msg
          git push
