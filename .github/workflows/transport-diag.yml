name: transport-gate

# CI gate for the vendored libcurl transport seam (issue #11 and its
# fix). CI runs no browser by design, so this is the only place the
# wasm transport is exercised end to end: the real
# @mercuryworkshop/libcurl-transport 2.0.5 bundle connects to a local
# zeolite-server wisp endpoint. Unpatched, craigslist's close-delimited
# empty-body 302 dies with curl error 56 before any response object
# exists; with the engine's runtime patch
# (app/src/libcurl-transport-vendored.ts) the 302 must surface. The run
# fails if the seam regresses. Keep in sync with
# suite/transport-diag.mjs.
#
# The epoxy leg (issue #64) gates the vendored epoxy-tls FULL build the
# same way (suite/epoxy-diag.mjs): fetch parity against deterministic
# loopback fixtures (byte-exact body, both Set-Cookie pairs off
# rawHeaders, an unfollowed 302) and the full-build-only websocket
# round-trip.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    # A wedged transport must fail in minutes, not hang the job for
    # an hour behind emscripten's kept-alive event loop.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build zeolite-server
        run: cargo build -p zeolite-server --release
      - name: Start zeolite-server
        # ZL_TEST_ALLOW_PRIVATE_DESTS=1: the test-only policy escape
        # hatch (crates/zeolite-server/src/policy.rs), same as the
        # nightly compat suite. The epoxy leg fixtures live on
        # loopback, so the wisp relay must reach 127.0.0.1 during the
        # gate run only.
        run: |
          ZL_TEST_ALLOW_PRIVATE_DESTS=1 PORT=6002 ./target/release/zeolite-server > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6002/)
            if [ "$code" != "000" ]; then
              echo "server up (http $code) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never came up"
          cat server.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install transport
        run: npm i @mercuryworkshop/libcurl-transport@2.0.5 ws
      - name: Run transport gate
        run: node suite/transport-diag.mjs
      - name: Install epoxy transport (#64)
        run: npm i @mercuryworkshop/epoxy-tls@2.1.18-1
      - name: Run epoxy transport gate (#64)
        run: node suite/epoxy-diag.mjs
