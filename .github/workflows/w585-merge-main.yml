name: w585-merge-main

on:
  push:
    branches: [zl-ext-firefox-wave-c]
  workflow_dispatch:

# One-shot: merge origin/main into this branch so PR #585 merges
# cleanly. The branch carries the resolved versions of every file
# with main-side changes it lacked (ext control, app control, matrix);
# runtime.ts merges as-is because the branch's serve import line is a
# superset of main's. Idempotent.

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: zl-ext-firefox-wave-c
          fetch-depth: 0
      - name: Merge origin/main into the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already merged into this branch"
            exit 0
          fi
          if git merge origin/main -m "Merge main into zl-ext-firefox-wave-c: resolve wave C overlaps"; then
            echo "clean merge"
          else
            echo "conflicted paths:"
            git diff --name-only --diff-filter=U
            for f in $(git diff --name-only --diff-filter=U); do
              git checkout --ours -- "$f"
              git add "$f"
            done
            git commit --no-edit
          fi
          git push origin HEAD:zl-ext-firefox-wave-c
