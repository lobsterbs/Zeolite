name: Branch cleanup

# One-shot maintenance workflow: deletes the superseded fix/* branches.
# Their content is already on main (verified 2026-10-16: issue fixes landed
# via the squash/parallel-agent waves). Self-removing: only triggers when
# this file itself changes, and gets deleted once the cleanup has run.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded fix/* branches
        run: |
          for b in \
            fix/big-app-requests \
            fix/big-rewriter \
            fix/big-transport \
            fix/css-multibyte-panic \
            fix/medium-app-storage \
            fix/medium-rewriter-fragment \
            fix/rewriter-small-batch ; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              if git push origin --delete "$b"; then
                echo "deleted $b"
              else
                echo "::warning::failed to delete $b"
              fi
            else
              echo "already gone: $b"
            fi
          done
