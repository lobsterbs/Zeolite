name: branch-cleanup
on:
  push:
    paths:
      - '.github/workflows/branch-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete merged branches
        run: |
          git push origin --delete fix/ghostery-adblocker || true
          git push origin --delete feat/wisp-primary-setter || true
          git push origin --delete fix/scout-2026-10-20 || true
          git push origin --delete fix/filed-scout-issues || true
