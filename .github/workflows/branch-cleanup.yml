name: branch-cleanup (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete superseded branches
        run: |
          git push origin --delete fix/navh-expiry-remint feat/prel-clean-any-parent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
