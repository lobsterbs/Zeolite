name: apply-wave4
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-wave4.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch and remove the runner
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/w4.patch
          cat > /tmp/w4msg <<'ZLEOF'
          fix(app): per-client jar profiles + resilient jar persistence (#267, #254)
          
          - #267: jar profiles are scoped to the requesting host client. The SW-side seam (applySetCookie, cookieHeaderFor via CookieRequestContext.clientId, documentCookieRead/Write, jarSnapshot/jarEnumeration/jarClearScope, zl:jarProfile/zl:getJars/zl:clearJar/zl:docCookie/zl:exportSession/zl:importSession) resolves the active profile from the requesting client id; a client that never sent zl:jarProfile keeps the legacy global behavior; switching back drops only that client's throwaway jars; the zl:ping echo and zl:getJars active flag report the requester's own profile.
          - #254: jar persistence is resilient to worker termination: writes serialize on one chain (an older snapshot can never land after a newer one; a rejected write never wedges the chain), fetch events and control messages keep the write alive via waitUntil(flushJarPersist()), and import/clear/teardown acks are durable before the reply. Storage failures surface as STORAGE diag events instead of being swallowed.
          
          Tests: jar-client-profiles.test.ts (8: per-client isolation, doc.cookie scoping, per-client switch-back, global fallback, enumeration active marking, scoped clear, durable flush, serialized writes), jar-persist-resilience.test.ts (1: storage failure surfaces a STORAGE diag, flush never throws). Full suite 1351 passed, tsc clean.
          ZLEOF
          git config user.name 'lobsterbs'
          git config user.email 'dev@lobsterbs.dev'
          git apply --check /tmp/w4.patch
          git apply /tmp/w4.patch
          git rm -q .github/workflows/apply-wave4.yml
          git add -A
          git commit -q -F /tmp/w4msg
          git push
