name: w64-oneshot
on:
  push:
    branches: [w64-449]
permissions:
  contents: write
jobs:
  push-449:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: convert placeholders
        run: python3 -c "s=open('.w64-patch.py').read(); open('.w64-patch.py','w').write(s.replace('@BS@', chr(92)).replace('@BT@', chr(96)))"
      - name: sha gate
        run: echo "88e8d4073097cc7c1ca3d5cc47ecab06b9fc6f0f8c7413ea16f73897449cd564  .w64-patch.py" | sha256sum -c -
      - name: apply patch
        run: python3 .w64-patch.py "$PWD"
      - name: rustfmt
        run: rustfmt --edition 2021 crates/rewriter/src/js/literals.rs crates/rewriter/src/js/mod.rs crates/rewriter/src/wasm.rs
      - name: commit and push
        run: |
          rm -f .w64-patch.py .github/workflows/w64-oneshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rewriter): script-level URL-literal skip for origin-pinning scripts (#449)" -m "Fixes #449"
          git push origin HEAD:main
          git push origin --delete w64-449
