name: apply-pr362-ci-fix
on:
  push:
    branches: [fix/zeolite-client-lineage]
    paths: [.github/workflows/apply-pr362-ci-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply patch and remove the runner
        run: |
          set -e
          echo '' | base64 -d | gunzip > /tmp/p362.patch
          git config user.name 'lobsterbs'
          git config user.email 'dev@lobsterbs.dev'
          git apply --check /tmp/p362.patch
          git apply /tmp/p362.patch
          git rm -q .github/workflows/apply-pr362-ci-fix.yml
          git add -A
          git commit -q -m 'fix(app): make the legacy page cache discard tolerant of a partial caches surface'
          git push
