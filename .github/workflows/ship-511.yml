name: ship-511
on:
  push:
    paths:
      - ".github/workflows/ship-511.yml"
permissions:
  contents: write
jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Apply the 511 nav-bound mint seam
        run: |
          node <<'NODEEOF'
const fs = require("node:fs");
const FILES = [{"path":"app/src/control.ts","pairs":[["  queryRoutes?: boolean;","  queryRoutes?: boolean;\n  /** zl:mint: navigation-bound mint (the navguard absolute\n      location/href writes). Only this caller gets the query-shape\n      handle behind the queryRoutes opt-in; the re-emission mints\n      stay path-formed - a query handle would expose the real path\n      and query in browser-visible records, defeating that seam. */\n  nav?: boolean;"],["      const hash = dest.indexOf(\"#\");\n      const route = hash < 0 ? encodeDest(dest) : encodeDest(dest.slice(0, hash)) + dest.slice(hash);\n      reply({ ok: true, route });","      const hash = dest.indexOf(\"#\");\n      const body = hash < 0 ? dest : dest.slice(0, hash);\n      const tail = hash < 0 ? \"\" : dest.slice(hash);\n      /* Injector phase 2 (#511 absolute-write seam): a nav-bound\n         mint (the navguard location/href writes) with queryRoutes\n         on takes the query-shape handle (<real path>?<real query>&\n         zlNavh=<token>) so an absolute location write commits the\n         real pathname natively - pathname-routed SPAs (Blooket's\n         /:gameId/play/:playerId) read location.pathname without any\n         shim and would otherwise see the opaque /zl/<keyed> scheme\n         route and fall into their catch-all (\"Game not found.\").\n         Re-emission mints (fetch/beacon/XHR inputs) stay path-\n         formed: a query handle would print the real path and query\n         into the very records that seam exists to keep clean. A\n         mint-refused collision (an engine-internal path) or a\n         missing route key falls back to the path-form route; an\n         expired handle re-mints at the serve seam (request.ts), so\n         long-lived anchors stay usable. */\n      const qh = msg.nav === true && queryRoutesEnabled()\n        ? buildQueryHandleUrl(body)\n        : null;\n      const route = qh !== null ? qh + tail : encodeDest(body) + tail;\n      reply({ ok: true, route });"]]},{"path":"app/src/bootstrap/mint.ts","pairs":[["export function mintRoute(dest: string, timeout = 5000): Promise<string | null> {\n  const hit = memo.get(dest);","export function mintRoute(dest: string, nav = false, timeout = 5000): Promise<string | null> {\n  /* #511: the two callers need different shapes for the same dest -\n     a navigation write wants the query handle, a re-emission input\n     must stay opaque - so the memo key carries the shape. */\n  const key = nav ? \"nav:\" + dest : dest;\n  const hit = memo.get(key);"],["    memo.delete(dest);\n    memo.set(dest, hit);\n    return hit;\n  }\n  const p = new Promise<string | null>((resolve) => {\n    controlQuery({ type: \"zl:mint\", dest }, (m) => {","    memo.delete(key);\n    memo.set(key, hit);\n    return hit;\n  }\n  const p = new Promise<string | null>((resolve) => {\n    controlQuery(nav ? { type: \"zl:mint\", dest, nav: true } : { type: \"zl:mint\", dest }, (m) => {"],["  if (memo.size >= MINT_MEMO_CAP) {\n    const oldest = memo.keys().next();\n    if (!oldest.done) memo.delete(oldest.value);\n  }\n  memo.set(dest, p);\n  p.then((route) => {\n    /* #459: delete only OUR entry - an evicted promise settling\n       after a newer mint for the same dest must not drop it. */\n    if (!route && memo.get(dest) === p) memo.delete(dest);\n  });","  if (memo.size >= MINT_MEMO_CAP) {\n    const oldest = memo.keys().next();\n    if (!oldest.done) memo.delete(oldest.value);\n  }\n  memo.set(key, p);\n  p.then((route) => {\n    /* #459: delete only OUR entry - an evicted promise settling\n       after a newer mint for the same dest must not drop it. */\n    if (!route && memo.get(key) === p) memo.delete(key);\n  });"]]},{"path":"app/src/bootstrap/navguard.ts","pairs":[["    mintRoute(dest).then((route) => {\n      if (raw.get(el)?.[key] !== wrote) return;","    mintRoute(dest, true).then((route) => {\n      if (raw.get(el)?.[key] !== wrote) return;"],["      mintRoute(d).then((route) => {\n        const r = route ?? navEncode(d);","      mintRoute(d, true).then((route) => {\n        const r = route ?? navEncode(d);"],["        mintRoute(dest).then((route) => {\n          const target = route ?? navEncode(dest);","        mintRoute(dest, true).then((route) => {\n          const target = route ?? navEncode(dest);"],["            mintRoute(d).then((route) => {\n              try {\n                if (el.getAttribute(\"src\") === \"\") el.setAttribute(\"src\", route ?? navEncode(d));","            mintRoute(d, true).then((route) => {\n              try {\n                if (el.getAttribute(\"src\") === \"\") el.setAttribute(\"src\", route ?? navEncode(d));"]]},{"path":"app/src/__tests__/queryroute.test.ts","pairs":[["  });\n});\n\ndescribe(\"query-route navigation (handleFetch arms)\", () => {","  });\n\n  /* #511 absolute-write seam: the same opt-in gates zl:mint, the verb\n     the bootstrap nav guard uses for absolute location/href writes. A\n     pathname-routed SPA (Blooket /:gameId/play/:playerId) commits the\n     minted route as its location; the query shape keeps\n     location.pathname the real path, the path form left it opaque\n     (/zl/<keyed>) and the SPA fell into its catch-all. */\n  it(\"mints the query shape only behind the queryRoutes opt-in (zl:mint)\", async () => {\n    const before = mkReplies();\n    await dispatchCore(\n      { type: \"zl:mint\", nav: true, dest: \"https://b.example/6ae3/play/42\" } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:mint\" } as unknown as ControlMessage), before.reply),\n    );\n    /* default OFF: the path-form scheme route */\n    expect((before.replies[0] as { route: string }).route.startsWith(\"/j/\")).toBe(true);\n\n    const cfg = mkReplies();\n    await dispatchCore(\n      { type: \"zl:config\", prefix: \"/j/\", queryRoutes: true } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:config\" } as unknown as ControlMessage), cfg.reply),\n    );\n\n    const after = mkReplies();\n    await dispatchCore(\n      { type: \"zl:mint\", nav: true, dest: \"https://b.example/6ae3/play/42\" } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:mint\" } as unknown as ControlMessage), after.reply),\n    );\n    const route = (after.replies[0] as { route: string }).route;\n    expect(route.startsWith(\"/6ae3/play/42?zlNavh=\")).toBe(true);\n    expect(decodeClientUrl(new URL(route, ORIGIN))).toBe(\"https://b.example/6ae3/play/42\");\n  });\n\n  it(\"keeps the re-emission mint path-formed behind the queryRoutes opt-in (zl:mint)\", async () => {\n    const cfg = mkReplies();\n    await dispatchCore(\n      { type: \"zl:config\", prefix: \"/j/\", queryRoutes: true } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:config\" } as unknown as ControlMessage), cfg.reply),\n    );\n    const re = mkReplies();\n    await dispatchCore(\n      { type: \"zl:mint\", dest: \"https://b.example/6ae3/play/42\" } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:mint\" } as unknown as ControlMessage), re.reply),\n    );\n    /* a nav-less mint feeds fetch/beacon/XHR re-emission: the opaque\n       path form keeps the real path and query out of the browser-\n       visible request records, so queryRoutes must not reshape it */\n    expect((re.replies[0] as { route: string }).route.startsWith(\"/j/\")).toBe(true);\n  });\n\n  it(\"keeps the fragment off the handle token and off the decoded target (zl:mint)\", async () => {\n    const cfg = mkReplies();\n    await dispatchCore(\n      { type: \"zl:config\", prefix: \"/j/\", queryRoutes: true } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:config\" } as unknown as ControlMessage), cfg.reply),\n    );\n    const frag = mkReplies();\n    await dispatchCore(\n      { type: \"zl:mint\", nav: true, dest: \"https://b.example/p?a=1#f2\" } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:mint\" } as unknown as ControlMessage), frag.reply),\n    );\n    const route = (frag.replies[0] as { route: string }).route;\n    expect(route.startsWith(\"/p?a=1&zlNavh=\")).toBe(true);\n    expect(route.endsWith(\"#f2\")).toBe(true);\n    expect(decodeClientUrl(new URL(route, ORIGIN))).toBe(\"https://b.example/p?a=1\");\n  });\n\n  it(\"falls back to the path-form route when the query mint refuses an engine path (zl:mint)\", async () => {\n    const cfg = mkReplies();\n    await dispatchCore(\n      { type: \"zl:config\", prefix: \"/j/\", queryRoutes: true } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:config\" } as unknown as ControlMessage), cfg.reply),\n    );\n    const nav = mkReplies();\n    await dispatchCore(\n      { type: \"zl:mint\", nav: true, dest: \"https://s.example/sw.js\" } as unknown as ControlMessage,\n      ctx(mkMsgEvent(ORIGIN + \"/\", { type: \"zl:mint\" } as unknown as ControlMessage), nav.reply),\n    );\n    expect((nav.replies[0] as { route: string }).route.startsWith(\"/j/\")).toBe(true);\n  });\n});\n\ndescribe(\"query-route navigation (handleFetch arms)\", () => {"]]}];
for (const f of FILES) {
  let src = fs.readFileSync(f.path, "utf8");
  for (const pair of f.pairs) {
    const n = src.split(pair[0]).length - 1;
    if (n !== 1) { console.error("ANCHOR COUNT " + n + " in " + f.path + " for: " + pair[0].slice(0, 70)); process.exit(1); }
    src = src.replace(pair[0], pair[1]);
  }
  fs.writeFileSync(f.path, src);
  console.log("ok " + f.path);
}
console.log("patch applied");
          NODEEOF
      - name: Patch touched exactly four tracked files
        run: |
          N=$(git status --porcelain | wc -l)
          echo "modified: $N"
          git diff --stat
          test "$N" = "4"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack (pinned prebuilt)
        run: |
          curl -sSfL -o /tmp/wasm-pack.tar.gz https://github.com/rustwasm/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo mv /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version
      - name: Build rewriter wasm
        run: |
          wasm-pack build crates/rewriter --target web --release --out-name rewriter_wasm
          mkdir -p app/src/rewriter_wasm
          cp crates/rewriter/pkg/rewriter_wasm* app/src/rewriter_wasm/
      - name: Build wisp wasm
        run: |
          wasm-pack build crates/wisp-wasm --target web --release --out-name wisp_wasm
          mkdir -p app/src/wisp_wasm
          cp crates/wisp-wasm/pkg/wisp_wasm* app/src/wisp_wasm/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck
        run: |
          cd app && npm install
          npx tsc --noEmit
      - name: Unit tests
        run: |
          cd app
          timeout 300 npx vitest run
      - name: Build app
        run: cd app && npm run build
      - name: Bootstrap size budget
        run: |
          SIZE=$(wc -c < app/dist/bootstrap.js)
          echo "bootstrap.js: $SIZE bytes"
          if [ "$SIZE" -ge 40704 ]; then echo "::error::BOOTSTRAP $SIZE bytes (budget 40704)"; exit 1; fi
      - name: Commit
        run: |
          git config user.name "zeolite-ci"
          git config user.email "ci@zeolite.invalid"
          git add -u
          git commit -q -m "#511: navguard location-write mints take the query-shape handle behind queryRoutes"
          git push
