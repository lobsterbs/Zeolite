name: Mirror to GitLab

# Push triggers removed until Zeolite#21 is fixed: the GITLAB_PAT
# value this repo's "lobster" environment holds is rejected by
# GitLab, so every push ran the mirror red and drowned the CI
# signal. Manual dispatch only until the secret is rotated; re-add
# push/create/delete next to workflow_dispatch with the fix.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # GITLAB_PAT lives in the "lobster" environment's secrets, and
    # environment secrets are only exposed to jobs that declare the
    # environment (Zeolite#21: without this the token resolves empty and
    # the push dies with authentication denied).
    environment: lobster
    steps:
      - name: Push mirror to GitLab
        run: |
          git clone --mirror https://github.com/lobsterbs/Zeolite.git repo.git
          cd repo.git
          git push --mirror "https://oauth2:${{ secrets.GITLAB_PAT }}@gitlab.com/lobsterbs/Zeolite.git"
