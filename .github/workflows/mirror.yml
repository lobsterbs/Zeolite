name: Mirror to GitLab

on:
  push:
  create:
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # GITLAB_PAT lives in the "lobster" environment's secrets, and
    # environment secrets are only exposed to jobs that declare the
    # environment (Zeolite#21: without this the token resolves empty and
    # the push dies with authentication denied).
    environment: lobster
    steps:
      - name: Push mirror to GitLab
        run: |
          git clone --mirror https://github.com/lobsterbs/Zeolite.git repo.git
          cd repo.git
          git push --mirror "https://oauth2:${{ secrets.GITLAB_PAT }}@gitlab.com/lobsterbs/Zeolite.git"
