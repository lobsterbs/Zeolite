name: fileread-tmp
on:
  push:
    branches: [tmp-fileread]
jobs:
  chunk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        f: [e2e]
        n: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: print chunk
        run: |
          case "${{ matrix.f }}" in
            e2e) p="suite/e2e/e2e.mjs" ;;
          esac
          curl -fsSL "https://raw.githubusercontent.com/lobsterbs/Zeolite/54cf081243e1043c5f577f3f8ebab2d890b06baf/$p" -o blob
          echo "ZLGITHASH-$(git hash-object blob)"
          split -b 8000 -d -a 2 blob part
          c=$(printf 'part%02d' ${{ matrix.n }})
          echo "ZLCHUNKHASH-${{ matrix.f }}-${{ matrix.n }}-$(sha1sum "$c" 2>/dev/null | cut -d' ' -f1 || echo EMPTY)"
          echo "ZLFILE-${{ matrix.f }}-${{ matrix.n }}-BEGIN"
          if [ -f "$c" ]; then base64 -w 0 "$c"; else echo ZLEMPTY; fi
          echo
          echo "ZLFILE-${{ matrix.f }}-${{ matrix.n }}-END"
