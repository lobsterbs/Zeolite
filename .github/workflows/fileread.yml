name: fileread
on:
  push:
    branches: [main]

# Temporary (removed by the next commit): the sandboxed read tooling is
# down (fetch proxy rate-limited, browser tool locked), and sw.ts grew
# past every remaining byte-capped read path. This job prints the file
# back in 8 base64 chunks so it can be reconstructed byte-verified.
jobs:
  dump:
    strategy:
      matrix:
        n: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: chunk
        run: |
          base64 -w0 app/src/sw.ts | awk -v n='${{ matrix.n }}' '{ c=int(length($0)/8)+1; print substr($0, n*c+1, c) }'
