name: fileread-tmp
on:
  push:
    branches: [tmp-fileread]
jobs:
  chunk:
    runs-on: ubuntu-latest
    steps:
      - name: print chunks
        run: |
          read_chunked() {
            f="$1"; p="$2"
            curl -fsSL "https://raw.githubusercontent.com/lobsterbs/Zeolite/main/$p" -o "$f"
            echo "ZLGITHASH-$f-$(git hash-object "$f")"
            echo "ZLSIZE-$f-$(wc -c < "$f")"
            split -b 8000 -d -a 2 "$f" "part_$f."
            for c in part_$f.*; do
              echo "ZLFILE-$f-${c#part_$f.}-BEGIN"
              base64 -w 0 "$c"
              echo
              echo "ZLFILE-$f-${c#part_$f.}-END"
            done
            rm -f "part_$f."*
          }
          read_chunked codec.ts app/src/codec.ts
          read_chunked codec.test.ts app/src/__tests__/codec.test.ts
          read_chunked sw.ts app/src/sw.ts
