name: w567 merge main
on:
  push:
    branches: [perf/cold-start-wisp-cache-v2]
permissions:
  contents: write
jobs:
  merge-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/cold-start-wisp-cache-v2
      - name: guarded merge of origin/main
        run: |
          git config user.name "zeolite-bot"
          git config user.email "zeolite-bot@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main already an ancestor; nothing to do"
            exit 0
          fi
          if git merge origin/main -m "Merge main into perf/cold-start-wisp-cache-v2 (pre-merge resolution for #567)"; then
            git push origin HEAD:perf/cold-start-wisp-cache-v2
            exit 0
          fi
          echo "=== conflicted files ==="
          git diff --name-only --diff-filter=U
          RESOLVED="app/src/libcurl-transport-vendored.ts app/src/transport.ts"
          for f in $RESOLVED; do
            if git diff --name-only --diff-filter=U | grep -qx "$f"; then
              git checkout --ours -- "$f"
              git add "$f"
            fi
          done
          LEFT=$(git diff --name-only --diff-filter=U)
          if [ -n "$LEFT" ]; then
            echo "=== unexpected conflicts remain ==="
            echo "$LEFT"
            git merge --abort
            exit 1
          fi
          git commit --no-edit
          git push origin HEAD:perf/cold-start-wisp-cache-v2
