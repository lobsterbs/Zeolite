[package]
name = "zeolite-adblock"
version.workspace = true
edition.workspace = true
license.workspace = true
# #613: the wasm-bindgen wrapper over Brave's adblock-rust engine
# (MPL-2.0 dependency). Edge crate: it must never become a dependency
# of the dep-free cores (wisp-core, rewriter, csp, config, cookies).
# cdylib for wasm-pack, rlib so the native clippy and test gates
# cover it. The TS side keeps its @ghostery/adblocker path as the
# fail-safe fallback when the module is missing, older, or its init
# failed.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adblock = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
