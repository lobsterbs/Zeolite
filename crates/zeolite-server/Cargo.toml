[package]
name = "zeolite-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zeolite standalone server: Wisp v2.1 TCP+UDP relay over WebSocket + static hosting of the engine app"

[[bin]]
name = "zeolite-server"
path = "src/main.rs"

[dependencies]
wisp-core = { workspace = true }
wisp-extensions = { workspace = true }
# #65 S-tier: "full" compiled process/fs machinery the server never calls.
# Direct usage set (CI-verified, includes lib.rs's tokio::signal::unix SIGTERM
# handler, missed by the first grep pass): rt-multi-thread (#[tokio::main]),
# macros (select!/#[tokio::test]), net (TcpListener/TcpStream), time
# (sleep/interval), io-util (AsyncReadExt/AsyncWriteExt on the wisp relay),
# sync (mpsc/oneshot), signal (SIGTERM). axum and tower pull their own tokio
# needs on top by feature unification, so nothing downstream regresses.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
bytes = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures = { version = "0.3" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rand = "0.8"
sha2 = "0.10"
